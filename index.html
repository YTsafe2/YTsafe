table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-size:12px}.sc{overflow-x:auto}.acts{display:flex;gap:6px;flex-wrap:wrap}
.ml{height:220px;overflow-y:auto;background:var(--sf2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}

.cb{display:flex;gap:6px;margin-top:6px}.th2{width:56px;height:34px;object-fit:cover;border-radius:6px;margin-right:4px}

body{background:#f7f7f8}@media(prefers-color-scheme:dark){body{background:#0a0a0a}}

.rules ol{padding-left:22px}.rules li{margin:12px 0}
footer{text-align:center;color:var(--mute);font-size:13px;padding:26px 16px 44px;border-top:1px solid var(--line);line-height:2}footer a{cursor:pointer;text-decoration:underline}
